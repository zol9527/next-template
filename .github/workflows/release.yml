# =============================================================================
# 发布自动化工作流配置
# =============================================================================
# 功能说明:
#   当 PR 合并到 release 分支时，自动执行完整的发布流程
#   也支持通过 workflow_dispatch 在本地 / act 中进行 dry-run 演练
#
# 触发条件:
#   - PR 合并到 release 分支（仅限 dev 分支或 hotfix/* 分支的 PR）
#   - 手动触发 workflow_dispatch（推荐用于 act 本地验证）
#
# 执行流程:
#   1. approval       - 等待 production environment 审批（真实发布）
#   2. release        - 生成版本号、更新日志、创建 Git tag
#   3. deploy-package - 构建部署包并上传 artifact
#   4. deploy         - 上传到生产服务器、执行健康检查（真实发布或沙箱演练）
#   5. sync-version   - 部署成功后，在远端单独同步版本元数据到数据库
#
# 安全说明:
#   - 使用 pull_request_target 以获取对仓库的写权限
#   - workflow_dispatch 默认为 dry-run，避免本地 act 演练污染 Git
# =============================================================================

name: Release Automation

on:
  pull_request_target:
    branches:
      - release
    types:
      - closed
  workflow_dispatch:
    inputs:
      dry_run:
        description: 是否只做本地演练，不执行 push、tag 和远端部署
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      run_remote_deploy:
        description: 是否执行真实远端部署，仅建议对沙箱环境开启
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      release_ref:
        description: 本地演练时检出的分支或提交
        required: true
        default: release
      head_ref:
        description: 模拟 PR 源分支
        required: true
        default: dev
      base_ref:
        description: 模拟 PR 目标分支
        required: true
        default: release
      pr_title:
        description: 模拟 PR 标题
        required: true
        default: 'feat: 本地发布演练'
      pr_body:
        description: 模拟 PR Body，可包含版本号说明
        required: false
        default: ''
      pr_number:
        description: 模拟 PR 编号，仅用于展示
        required: true
        default: '0'
      pr_url:
        description: 模拟 PR 链接，仅用于展示
        required: true
        default: 'https://example.com/local-release'

concurrency:
  group: release-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # approval: 生产环境发布审批关卡
  # ===========================================================================
  # 作用:
  #   在执行真实发布前，强制要求通过 GitHub Environment 的人工审批
  #   只有指定的审批人批准后，后续的 release/deploy job 才会执行
  #
  # 触发条件 (if):
  #   - 事件类型为 pull_request_target (PR 操作触发)
  #   - PR 已合并 (merged == true)
  #   - 源分支为 dev 或 hotfix/* (限制可触发发布的分支)
  #
  # 工作原理:
  #   1. GitHub 检测到 environment 配置
  #   2. 自动通知 Environment 中配置的审批人
  #   3. 审批人在 GitHub UI 中批准/拒绝
  #   4. 批准后此 job 状态变为 success，下游 job 开始执行
  #
  # 配置方式:
  #   1. 设置仓库变量 RELEASE_ENVIRONMENT (Settings → Secrets and variables → Actions → Variables)
  #   2. 创建对应名称的 Environment (Settings → Environments)
  #   3. 在 Environment 中添加 Required reviewers
  # ===========================================================================
  approval:
    # 多行条件表达式，>- 会将换行折叠为空格，最终合并成一行
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      (github.event.pull_request.head.ref == 'dev' || startsWith(github.event.pull_request.head.ref, 'hotfix/'))

    runs-on: ubuntu-latest

    permissions:
      contents: read

    # 关联 GitHub Environment，触发审批流程
    # Environment 名称由仓库变量 RELEASE_ENVIRONMENT 指定 (如: production)
    environment:
      name: ${{ vars.RELEASE_ENVIRONMENT }}

    steps:
      - name: Await production approval
        run: |
          echo "当前发布需要先通过 production environment 审批。"
          echo "审批通过后，release job 才会继续执行。"

  release:
    needs: approval

    if: >-
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (
          needs.approval.result == 'success' &&
          github.event.pull_request.merged == true &&
          (github.event.pull_request.head.ref == 'dev' || startsWith(github.event.pull_request.head.ref, 'hotfix/'))
        )
      )

    runs-on: ubuntu-latest

    env:
      CI: true
      NO_COLOR: '1'
      FORCE_COLOR: '0'
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      NEXT_TELEMETRY_DISABLED: '1'
      RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || 'release' }}
      RELEASE_HEAD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || github.event.pull_request.head.ref }}
      RELEASE_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || github.event.pull_request.base.ref }}
      RELEASE_PR_TITLE: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_title || github.event.pull_request.title }}
      RELEASE_PR_BODY: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_body || github.event.pull_request.body || '' }}
      RELEASE_PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
      RELEASE_PR_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_url || github.event.pull_request.html_url }}

    outputs:
      version: ${{ steps.version.outputs.version }}

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release-cli version
        id: release_cli_version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_CLI_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e

          TAG=$(gh api repos/zol9527/release-cli/releases/latest --jq '.tag_name')

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "❌ 无法解析 release-cli 最新版本"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "✅ release-cli 最新版本: $TAG"

      - name: Cache release-cli wheel
        uses: actions/cache@v4
        with:
          path: .cache/release-cli/${{ steps.release_cli_version.outputs.tag }}
          key: ${{ runner.os }}-release-cli-${{ steps.release_cli_version.outputs.tag }}

      - name: Install release-cli from GitHub Release
        env:
          # GitHub Token 用于访问 release-cli 仓库
          # 如果 zol9527/release-cli 是私有仓库，需要配置 RELEASE_CLI_GITHUB_TOKEN secret
          # 该 token 需要有 repo 和 read:packages 权限
          GH_TOKEN: ${{ secrets.RELEASE_CLI_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_CLI_TAG: ${{ steps.release_cli_version.outputs.tag }}
        run: |
          set -e

          CACHE_DIR=".cache/release-cli/${RELEASE_CLI_TAG}"

          mkdir -p "$CACHE_DIR"

          if ls "$CACHE_DIR"/*.whl >/dev/null 2>&1; then
            echo "♻️ 命中 release-cli 缓存: ${RELEASE_CLI_TAG}"
          else
            echo "📥 从 GitHub Release 下载 release-cli ${RELEASE_CLI_TAG}..."

            # gh release download 使用位置参数接收 tag，不支持 --tag。
            if ! gh release download "$RELEASE_CLI_TAG" --repo zol9527/release-cli --pattern "*.whl" --dir "$CACHE_DIR"; then
              echo ""
              echo "❌ 下载 release-cli 失败"
              echo ""
              echo "💡 故障排查："
              echo "   1. 如果 zol9527/release-cli 是私有仓库，请配置 RELEASE_CLI_GITHUB_TOKEN secret"
              echo "      - 访问: Settings → Secrets and variables → Actions → New repository secret"
              echo "      - Name: RELEASE_CLI_GITHUB_TOKEN"
              echo "      - Value: 创建一个有 repo 和 read:packages 权限的 GitHub Personal Access Token"
              echo "      - 创建 token: https://github.com/settings/tokens/new?scopes=repo,read:packages"
              echo ""
              echo "   2. 如果使用默认的 GITHUB_TOKEN，确保该仓库有访问 zol9527/release-cli 的权限"
              echo "   3. 检查 zol9527/release-cli 仓库是否存在且已发布 wheel 文件"
              exit 1
            fi
          fi

          echo "📦 安装 release-cli..."
          pip install --force-reinstall "$CACHE_DIR"/*.whl

          # 验证安装
          echo "✅ 验证安装..."
          if ! release-cli --help; then
            echo "❌ release-cli 安装验证失败"
            echo "💡 请检查 wheel 文件是否正确"
            exit 1
          fi

          echo "✅ release-cli 安装成功"

      - name: Verify release artifacts
        id: version
        shell: bash
        run: |
          # 验证 package.json 存在
          if [ ! -f "package.json" ]; then
            echo "❌ package.json 不存在"
            exit 1
          fi

          # 验证 docs/changes 目录存在
          if [ ! -d "docs/changes" ]; then
            echo "❌ docs/changes 目录不存在"
            exit 1
          fi

          # 读取版本号
          VERSION=$(node -p "require('./package.json').version")

          # 查找对应版本的 changelog 文件
          CHANGE_FILE=$(find docs/changes -maxdepth 1 -type f -name "*-v${VERSION}.md" | sort | tail -n 1)

          if [ -z "$CHANGE_FILE" ]; then
            echo "❌ 未找到版本 $VERSION 对应的变更文件"
            echo "💡 请先在 dev 分支执行 'make release-patch' 或 'make release-minor' 生成 docs/changes/*.md"
            exit 1
          fi

          echo "✅ 发布文件验证通过"
          echo "  版本号: v${VERSION}"
          echo "  变更文件: $CHANGE_FILE"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create or update release tag
        run: |
          if [ "$RELEASE_DRY_RUN" = 'true' ]; then
            echo "Dry-run 模式：将创建或复用标签 v${{ steps.version.outputs.version }}"
            exit 0
          fi
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.version.outputs.version }} already exists"
          else
            git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
            git push origin "v${{ steps.version.outputs.version }}"
          fi

      - name: Next step hint
        run: |
          if [ "$RELEASE_DRY_RUN" = 'true' ]; then
            echo "本地 dry-run 已完成：发布文件已生成，Git tag 仅做预览。"
            echo "如需继续验证部署包，请运行 deploy-package job。"
            exit 0
          fi
          echo "production environment 审批已通过，发布文件和 Git tag 已生成。"
          echo "deploy-package job 将继续构建并上传部署包，deploy job 会执行真实上传与健康检查。"

  deploy-package:
    needs: release

    if: >-
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (
          needs.release.result == 'success' &&
          github.event.pull_request.merged == true &&
          (github.event.pull_request.head.ref == 'dev' || startsWith(github.event.pull_request.head.ref, 'hotfix/'))
        )
      )

    runs-on: ubuntu-latest

    env:
      CI: true
      NO_COLOR: '1'
      FORCE_COLOR: '0'
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      NEXT_TELEMETRY_DISABLED: '1'
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || 'release' }}
      MFA_SECRET_ENCRYPTION_KEY: ci-build-mfa-secret-encryption-key-32-bytes
      DATABASE_PROVIDER: prisma
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PRISMA_DB_PROVIDER: mysql

    permissions:
      contents: read

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release-cli version
        id: release_cli_version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_CLI_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e

          TAG=$(gh api repos/zol9527/release-cli/releases/latest --jq '.tag_name')

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "❌ 无法解析 release-cli 最新版本"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "✅ release-cli 最新版本: $TAG"

      - name: Cache release-cli wheel
        uses: actions/cache@v4
        with:
          path: .cache/release-cli/${{ steps.release_cli_version.outputs.tag }}
          key: ${{ runner.os }}-release-cli-${{ steps.release_cli_version.outputs.tag }}

      - name: Generate Prisma Client
        run: NODE_ENV=production ./scripts/db/prisma/setup.sh --generate-only --force

      - name: Install release-cli from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_CLI_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_CLI_TAG: ${{ steps.release_cli_version.outputs.tag }}
        run: |
          set -e

          CACHE_DIR=".cache/release-cli/${RELEASE_CLI_TAG}"

          mkdir -p "$CACHE_DIR"

          if ls "$CACHE_DIR"/*.whl >/dev/null 2>&1; then
            echo "♻️ 命中 release-cli 缓存: ${RELEASE_CLI_TAG}"
          else
            echo "📥 从 GitHub Release 下载 release-cli ${RELEASE_CLI_TAG}..."

            # gh release download 使用位置参数接收 tag，不支持 --tag。
            if ! gh release download "$RELEASE_CLI_TAG" --repo zol9527/release-cli --pattern "*.whl" --dir "$CACHE_DIR"; then
              echo ""
              echo "❌ 下载 release-cli 失败"
              echo ""
              echo "💡 故障排查："
              echo "   1. 如果 zol9527/release-cli 是私有仓库，请配置 RELEASE_CLI_GITHUB_TOKEN secret"
              echo "   2. 如果使用默认的 GITHUB_TOKEN，确保该仓库有访问 zol9527/release-cli 的权限"
              echo "   3. 检查 zol9527/release-cli 仓库是否存在且已发布 wheel 文件"
              exit 1
            fi
          fi

          echo "📦 安装 release-cli..."
          pip install --force-reinstall "$CACHE_DIR"/*.whl

          if ! release-cli --help; then
            echo "❌ release-cli 安装验证失败"
            exit 1
          fi

          echo "✅ release-cli 安装成功"

      - name: Build deploy package
        run: make pack

      - name: Upload deploy package artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package-v${{ needs.release.outputs.version }}
          path: deploy-prepare/deploy.zip

      - name: Preview deploy package contents
        run: unzip -l deploy-prepare/deploy.zip | sed -n '1,80p'

  deploy:
    needs:
      - release
      - deploy-package

    if: >-
      always() && (
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.run_remote_deploy == 'true' &&
          needs.release.result == 'success' &&
          needs.deploy-package.result == 'success'
        ) ||
        (
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.merged == true &&
          (github.event.pull_request.head.ref == 'dev' || startsWith(github.event.pull_request.head.ref, 'hotfix/')) &&
          needs.release.result == 'success' &&
          needs.deploy-package.result == 'success'
        )
      )

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || 'release' }}
          fetch-depth: 0

      - name: Download deploy package artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package-v${{ needs.release.outputs.version }}
          path: deploy-prepare

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' '${{ secrets.SSH_KNOWN_HOSTS }}' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to production server
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_REMOTE_DIR: ${{ secrets.SERVER_PATH }}
          DEPLOY_NODE_VERSION: ${{ vars.DEPLOY_NODE_VERSION || '25' }}
          ZIP_PATH: deploy-prepare/deploy.zip
          REMOTE_TMP_ZIP: /tmp/deploy.zip
          DB_FORCE_KEEP: 1
          DB_RESET: 0
        run: bash scripts/deploy/remote-control.sh deploy

      - name: Run health check
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL 未配置，跳过健康检查。"
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$APP_URL/api/health" >/tmp/release-health.json; then
              cat /tmp/release-health.json
              exit 0
            fi
            echo "第 ${attempt} 次健康检查失败，10 秒后重试。"
            sleep 10
          done

          echo "❌ 部署完成后健康检查仍失败"
          exit 1

  sync-version:
    needs:
      - release
      - deploy

    if: >-
      always() &&
      needs.deploy.result == 'success' &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.run_remote_deploy == 'true' &&
          needs.release.result == 'success'
        ) ||
        (
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.merged == true &&
          (github.event.pull_request.head.ref == 'dev' || startsWith(github.event.pull_request.head.ref, 'hotfix/')) &&
          needs.release.result == 'success'
        )
      )

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' '${{ secrets.SSH_KNOWN_HOSTS }}' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync version metadata on production server
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_REMOTE_DIR: ${{ secrets.SERVER_PATH }}
          DEPLOY_NODE_VERSION: ${{ vars.DEPLOY_NODE_VERSION || '25' }}
        run: |
          ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_REMOTE_DIR='${DEPLOY_REMOTE_DIR}' DEPLOY_NODE_VERSION='${DEPLOY_NODE_VERSION}' bash -s" <<'REMOTE_SYNC'
          set -euo pipefail

          if [[ -z "${DEPLOY_REMOTE_DIR}" || "${DEPLOY_REMOTE_DIR}" == "/" ]]; then
              echo "❌ DEPLOY_REMOTE_DIR 非法"
              exit 2
          fi

          export PATH="$HOME/.bun/bin:$PATH"

          if [[ -s "$HOME/.nvm/nvm.sh" ]]; then
              # shellcheck disable=SC1090
              . "$HOME/.nvm/nvm.sh"
              nvm use "${DEPLOY_NODE_VERSION}" >/dev/null 2>&1 || {
                  nvm install "${DEPLOY_NODE_VERSION}" >/dev/null
                  nvm use "${DEPLOY_NODE_VERSION}" >/dev/null
              }
          fi

          cd "${DEPLOY_REMOTE_DIR}"

          test -f package.json || {
              echo "❌ 远端目录缺少 package.json"
              exit 1
          }

          test -f .env || {
              echo "❌ 远端目录缺少 .env"
              exit 1
          }

          echo "📝 同步版本记录到数据库"
          bun run release:sync
          REMOTE_SYNC
