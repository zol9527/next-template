name: "Project Copilot Setup"

# Triggers the workflow on manual dispatch, push, or pull request to this file
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
    # *注意* 这里必须使用这个名称
    copilot-setup-steps:
        runs-on: ubuntu-latest

        permissions:
          contents: read

        # steps
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                fetch-depth: 0

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                bun-version: latest

            - name: Cache node modules
              uses: actions/cache@v4
              with:
                path: |
                  ~/.bun/install/cache
                  node_modules
                key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
                restore-keys: |
                  ${{ runner.os }}-bun-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Cache Prisma
              uses: actions/cache@v4
              with:
                path: |
                  node_modules/.prisma
                  node_modules/@prisma
                key: ${{ runner.os }}-prisma-${{ hashFiles('**/prisma/schema.prisma') }}
                restore-keys: |
                  ${{ runner.os }}-prisma-
