# =============================================================================
# CI 工作流配置
# =============================================================================
# 功能说明:
#   持续集成工作流，在 Pull Request 时自动执行代码验证
#
# 触发条件:
#   - 向 dev 分支提交 PR
#   - 向 release 分支提交 PR
#
# 执行任务:
#   - 代码检查 (Lint)
#   - 单元测试 (Unit tests)
#   - 构建验证 (Build)
# =============================================================================

name: CI

# -----------------------------------------------------------------------------
# 触发器配置
# -----------------------------------------------------------------------------
# 当以下分支收到 Pull Request 时触发工作流
on:
  pull_request:
    branches:
      - dev      # 开发分支：日常开发合并目标
      - release  # 发布分支：版本发布前的稳定分支

# -----------------------------------------------------------------------------
# 并发控制
# -----------------------------------------------------------------------------
# 防止同一 PR 的多个工作流同时运行，节省资源
# group: 使用 PR 编号或分支引用作为唯一标识
# cancel-in-progress: 如果有新的提交，取消正在运行的旧工作流
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# -----------------------------------------------------------------------------
# 任务定义
# -----------------------------------------------------------------------------
jobs:
  validate:
    # 运行环境：最新的 Ubuntu 系统
    runs-on: ubuntu-latest

    env:
      CI: true
      NO_COLOR: '1'
      FORCE_COLOR: '0'
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      NEXT_TELEMETRY_DISABLED: '1'

    # 权限配置：仅读取代码内容，遵循最小权限原则
    permissions:
      contents: read

    steps:
      # -----------------------------------------------------------------------
      # 步骤 1: 检出代码
      # -----------------------------------------------------------------------
      # fetch-depth: 0 表示获取完整的 git 历史，用于某些需要历史记录的分析工具
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 步骤 2: 安装 Bun 运行时
      # -----------------------------------------------------------------------
      # Bun 是一个高性能的 JavaScript 运行时和包管理器
      # 相比 npm/yarn/pnpm，Bun 在安装速度和运行性能上有显著优势
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # -----------------------------------------------------------------------
      # 步骤 3: 缓存依赖
      # -----------------------------------------------------------------------
      # 缓存 Bun 的安装缓存和 node_modules 目录
      # 通过 bun.lock 文件的哈希值作为缓存键，依赖变化时自动更新缓存
      # 这可以显著减少 CI 的执行时间
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # -----------------------------------------------------------------------
      # 步骤 4: 安装项目依赖
      # -----------------------------------------------------------------------
      # --frozen-lockfile: 确保安装版本与 lock 文件完全一致
      # 防止依赖版本不一致导致的构建问题
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # -----------------------------------------------------------------------
      # 步骤 4.1: 生成 Prisma Client
      # -----------------------------------------------------------------------
      # act / GitHub Actions 都是干净检出环境，不会带上本地未提交的 generated 产物
      # 项目运行时依赖 src/lib/prisma/generated/prisma，因此需要在 CI 中显式生成
      - name: Generate Prisma Client
        run: bunx prisma generate --schema prisma/schema.prisma

      # -----------------------------------------------------------------------
      # 步骤 5: 代码静态检查
      # -----------------------------------------------------------------------
      # 执行 ESLint 检查代码质量和规范
      # 包括：语法错误、潜在 bug、代码风格等
      - name: Lint
        run: bun run lint

      # -----------------------------------------------------------------------
      # 步骤 6: 单元测试
      # -----------------------------------------------------------------------
      # 执行 Vitest 单元测试
      # 确保代码逻辑正确，防止回归问题
      - name: Unit tests
        run: bun run test

      # -----------------------------------------------------------------------
      # 步骤 7: 构建项目
      # -----------------------------------------------------------------------
      # 执行 Next.js 生产环境构建
      # 验证代码可以成功编译，没有类型错误或构建错误
      - name: Build
        env:
          MFA_SECRET_ENCRYPTION_KEY: ci-build-mfa-secret-encryption-key-32-bytes
          DATABASE_PROVIDER: prisma
          DATABASE_URL: file:./prisma/dev.db
        run: bun run build
