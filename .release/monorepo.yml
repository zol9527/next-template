# =============================================================================
# Monorepo 模板发布单元配置
# =============================================================================

version:
  source: git-tag
  tag_prefix: "monorepo/v"
  file: _state/monorepo.VERSION
  hook: _shared/hooks/hook-version.py

changelog:
  output_dir: docs/changes

filter:
  ignore_messages:
    - "^docs:.*"
    - "^chore:.*"
    - "^style:.*"
    - ".*WIP.*"
    - ".*merge.*"
    - "^Revert.*"
  keep_types:
    - feat
    - fix
    - perf
    - refactor
    - security

release:
  steps:
    - preflight
    - prepare
    - commit
    - pr
  allowed_branches:
    - "^dev$"
    - "^hotfix/.+$"
    - "^codex/.+$"
  auto_stage: true
  commit_title: "🚀 release: {tag}"
  create_pr: false
  push: false
  base_branch: release

workflow:
  release:
    script: _shared/hooks/hook-release.py

packager:
  root_dir: ..
  output_dir: dist
  name: next-template-monorepo-{version}
  respect_gitignore: true
  build:
    enabled: false
    script: _shared/hooks/hook-pack.py
  include:
    - "*"
  exclude:
    - .git
    - .github
    - .release/_state
    - apps/backend/prisma/*.db-journal
    - apps/backend/test-uploads
  force_include:
    - apps/backend/prisma/schema.prisma
