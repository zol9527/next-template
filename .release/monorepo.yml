# =============================================================================
# Monorepo 模板发布单元配置
# =============================================================================

version:
  source: git-tag
  tag_prefix: "monorepo/v"
  file: _state/monorepo.VERSION
  hook: _shared/hooks/hook-version.py

changelog:
  output_dir: docs/changes

filter:
  ignore_messages:
    - "^docs:.*"
    - "^chore:.*"
    - "^style:.*"
    - ".*WIP.*"
    - ".*merge.*"
    - "^Revert.*"
  keep_types:
    - feat
    - fix
    - perf
    - refactor
    - security

release:
  steps:
    - preflight
    - prepare
    - commit
    - pr
  allowed_branches:
    - "^dev$"
    - "^hotfix/.+$"
    - "^codex/.+$"
  auto_stage: true
  create_pr: false
  push: false
  base_branch: release

workflow:
  release:
    script: _shared/hooks/hook-release.py

packager:
  root_dir: ..
  output_dir: release
  name: next-template-monorepo-{version}
  include:
    - package.json
    - bun.lock
    - README.md
    - Makefile
    - AGENTS.md
    - .release
    - apps
    - packages
  exclude:
    - .git
    - .github
    - .beads
    - .release/_state
    - __pycache__
    - .venv
    - node_modules
    - release
    - apps/**/node_modules
    - apps/**/dist
    - apps/**/.next
    - apps/**/deploy-prepare
