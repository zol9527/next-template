# =============================================================================
# Backend 发布单元配置
# =============================================================================

version:
  source: git-tag
  tag_prefix: "backend/v"
  file: _state/backend.VERSION
  hook: _shared/hooks/hook-version.py

changelog:
  output_dir: docs/changes

filter:
  ignore_messages:
    - "^docs:.*"
    - "^chore:.*"
    - "^style:.*"
    - ".*WIP.*"
    - ".*merge.*"
    - "^Revert.*"
  keep_types:
    - feat
    - fix
    - perf
    - refactor
    - security

release:
  steps:
    - preflight
    - prepare
    - commit
    - pr
  allowed_branches:
    - "^dev$"
    - "^hotfix/.+$"
    - "^codex/.+$"
  auto_stage: true
  create_pr: false
  push: false
  base_branch: release

workflow:
  release:
    script: _shared/hooks/hook-release.py

packager:
  root_dir: ../apps/backend
  output_dir: deploy-prepare
  name: backend-{version}
  include:
    - .next
    - public
    - package.json
    - ecosystem.config.cjs
    - prisma/schema.prisma
    - prisma/migrations
    - prisma.config.ts
    - docs/changes
    - scripts
    - src/config
    - src/lib
  exclude:
    - .git
    - .github
    - .beads
    - __pycache__
    - .venv
    - node_modules
    - deploy-prepare
    - scripts/seed/modules/optional
    - src/lib/prisma/generated
