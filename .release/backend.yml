# =============================================================================
# Backend 发布单元配置
# =============================================================================

version:
  source: git-tag
  tag_prefix: "backend/v"
  file: _state/backend.VERSION
  hook: _shared/hooks/hook-version.py

changelog:
  output_dir: docs/changes

filter:
  ignore_messages:
    - "^docs:.*"
    - "^chore:.*"
    - "^style:.*"
    - ".*WIP.*"
    - ".*merge.*"
    - "^Revert.*"
  keep_types:
    - feat
    - fix
    - perf
    - refactor
    - security

release:
  steps:
    - preflight
    - prepare
    - commit
    - pr
  allowed_branches:
    - "^dev$"
    - "^hotfix/.+$"
    - "^codex/.+$"
  auto_stage: true
  commit_title: "🚀 release: {tag}"
  create_pr: false
  push: false
  base_branch: release

workflow:
  release:
    script: _shared/hooks/hook-release.py

packager:
  root_dir: ../apps/backend
  output_dir: dist
  name: backend-{version}
  respect_gitignore: true
  include:
    - "*"
  exclude:
    - .git
    - .github
    - scripts/seed/modules/optional
    - src/lib/prisma/generated
  force_include:
    - .next/BUILD_ID
    - .next/package.json
    - .next/*.json
    - .next/*.js
    - .next/server
    - .next/static
    - prisma/schema.prisma
