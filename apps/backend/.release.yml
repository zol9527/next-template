# =============================================================================
# Release Cli 配置
# =============================================================================
# 完整配置参考: https://github.com/zol9527/release-cli
# =============================================================================

# -----------------------------------------------------------------------------
# 版本管理
# -----------------------------------------------------------------------------
version:
  # 版本来源:
  # git-tag -> 从最近的 Git tag 读取
  source: 'git-tag'

  # 写入版本后执行的 Hook 脚本
  # release-cli 会把一个 payload.json 的路径作为唯一参数传给它
  # 你只需要在 Hook 模板里的 apply_version_update(context) 中补自己的业务逻辑
  hook: scripts/release-version-hook.py

# -----------------------------------------------------------------------------
# 变更日志配置
# -----------------------------------------------------------------------------
changelog:
  # changelog 输出目录，默认相对 packager.root_dir 生成 docs/changes/<日期>-v<版本>.md
  output_dir: docs/changes

# -----------------------------------------------------------------------------
# 提交过滤配置
# -----------------------------------------------------------------------------
filter:
  # 忽略的提交消息（支持正则表达式）
  ignore_messages:
    - "^docs:.*"
    - "^chore:.*"
    - "^style:.*"
    - ".*WIP.*"
    - ".*merge.*"
    - "^Revert.*"

  # 保留的提交类型（白名单）
  keep_types:
    - feat
    - fix
    - perf
    - refactor
    - security

# -----------------------------------------------------------------------------
# 打包配置
# -----------------------------------------------------------------------------
packager:
  # 项目根目录。默认就是当前配置文件所在目录。
  # 如果你把配置文件放在子目录，例如 .release/release.yml，可改成 ..
  root_dir: .

  # 输出目录
  output_dir: deploy-prepare

  # 输出文件名模板（最终会自动追加 .zip）
  name: deploy

  # 需要打包的文件/目录
  include:
    - .next
    - public
    - package.json
    - bun.lock
    - ecosystem.config.cjs
    - prisma/schema.prisma
    - prisma/migrations
    - prisma.config.ts
    - docs/changes
    - scripts
    - src/config
    - src/lib

  # 不需要打进 zip 的文件或目录
  exclude:
    - .git
    - .github
    - .beads
    - __pycache__
    - .venv
    - node_modules
    - deploy-prepare
    - scripts/seed/modules/optional
    - src/lib/prisma/generated
