<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 柔和背景圆 -->
  <circle cx="60" cy="60" r="56" fill="#FFF0F0"/>

  <!-- 优惠券主体（灰调 + 过期标识） -->
  <path d="M28 40 L92 40 L92 68 C86 68 82 72 82 78 C82 84 86 88 92 88 L92 92 L28 92 L28 88 C34 88 38 84 38 78 C38 72 34 68 28 68 Z"
        fill="white" stroke="#FF4D4F" stroke-width="2.5" stroke-linejoin="round" opacity="0.7"/>

  <!-- 左侧锯齿 -->
  <circle cx="28" cy="54" r="4" fill="#FFF0F0" stroke="#FF4D4F" stroke-width="1.5" opacity="0.7"/>
  <circle cx="28" cy="78" r="4" fill="#FFF0F0" stroke="#FF4D4F" stroke-width="1.5" opacity="0.7"/>

  <!-- 金额区域（灰色划线效果） -->
  <text x="44" y="64" font-family="JetBrains Mono, system-ui" font-size="22" font-weight="800" fill="#6B8A94" opacity="0.5">¥50</text>
  <!-- 划线 -->
  <line x1="42" y1="60" x2="68" y2="60" stroke="#FF4D4F" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

  <!-- 分割虚线 -->
  <line x1="70" y1="46" x2="70" y2="63" stroke="#E2EBED" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- 标题线条 -->
  <line x1="76" y1="50" x2="88" y2="50" stroke="#6B8A94" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <line x1="76" y1="56" x2="86" y2="56" stroke="#6B8A94" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>

  <!-- 底部线条 -->
  <line x1="36" y1="78" x2="66" y2="78" stroke="#6B8A94" stroke-width="1.2" stroke-linecap="round" opacity="0.2"/>
  <line x1="36" y1="84" x2="54" y2="84" stroke="#6B8A94" stroke-width="1.2" stroke-linecap="round" opacity="0.15"/>

  <!-- 过期时钟图标（右下角） -->
  <circle cx="88" cy="86" r="14" fill="#FF4D4F" opacity="0.85"/>
  <circle cx="88" cy="86" r="9" fill="none" stroke="white" stroke-width="1.8"/>
  <line x1="88" y1="86" x2="88" y2="80.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="88" y1="86" x2="93" y2="88" stroke="white" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 装饰 -->
  <circle cx="30" cy="26" r="1.5" fill="#FF4D4F" opacity="0.3"/>
  <circle cx="96" cy="48" r="1.2" fill="#FF4D4F" opacity="0.2"/>
</svg>
