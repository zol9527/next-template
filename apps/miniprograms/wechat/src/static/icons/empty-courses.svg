<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 柔和背景圆 -->
  <circle cx="60" cy="60" r="56" fill="#E8F7F0"/>

  <!-- 打开的书籍 - 左页 -->
  <path d="M30 38 L57 44 L57 84 L30 78 Z" fill="white" stroke="#009666" stroke-width="2" stroke-linejoin="round"/>
